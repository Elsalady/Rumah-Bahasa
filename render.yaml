# ============================================
# Render Blueprint — Rumah Bahasa Surabaya
# Deploy otomatis: web service + PostgreSQL
# ============================================
services:
  - type: web
    name: rumah-bahasa
    runtime: php
    plan: free
    buildCommand: "composer install --no-dev --optimize-autoloader"
    startCommand: "php artisan serve --host=0.0.0.0 --port=$PORT"
    preDeployCommand: "php artisan storage:link"
    envVars:
      - key: APP_NAME
        value: "Rumah Bahasa"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      # GANTI URL ini dengan URL service kamu setelah dibuat di Render
      - key: APP_URL
        value: https://rumah-bahasa.onrender.com
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: APP_LOCALE
        value: id
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: rumah-bahasa-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rumah-bahasa-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: rumah-bahasa-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: rumah-bahasa-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rumah-bahasa-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log

databases:
  - name: rumah-bahasa-db
    plan: free
    databaseName: rumah_bahasa
    user: rumah_bahasa
